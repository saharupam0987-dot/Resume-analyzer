# =============================================================================
# Production Nginx Reverse Proxy Configuration
# =============================================================================

upstream frontend_upstream {
    server frontend:80;
}

upstream fastapi_upstream {
    server fastapi:8000;
}

server {
    listen 80;
    server_name localhost;

    # PDF upload limit (50MB matches MAX_PDF_SIZE_MB)
    client_max_body_size 50M;

    # Generous timeouts for AI generation and embedding processing
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Reverse proxy FastAPI API routes & documentation
    location ~ ^/(auth|exams|submissions|tasks|classes|student|students|docs|redoc|openapi.json|health)(/.*)?$ {
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Support optional /api/ prefix routing to FastAPI
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse proxy all frontend requests to React Vite container
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Internal healthcheck probe endpoint for Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}
